<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wireless Mic — Premium Controller</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#f1f5f9;background:#030712;padding:20px}
body:before{content:"";position:fixed;inset:-50%;background:radial-gradient(circle at 20% 20%,rgba(99,102,241,0.12),transparent 40%),radial-gradient(circle at 80% 80%,rgba(236,72,153,0.1),transparent 40%);z-index:-1;filter:blur(60px)}
.wrap{width:min(1200px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.brand{font-size:22px;font-weight:800;background:linear-gradient(135deg,#818cf8,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:rgba(15,23,42,0.75);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:20px;box-shadow:0 20px 40px -15px rgba(0,0,0,0.7);backdrop-filter:blur(20px)}
.lock{max-width:400px;margin:15vh auto;text-align:center}
.lock input{width:100%;margin:16px 0;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(2,6,23,0.6);color:white;font-size:16px;outline:none}
button{border:0;border-radius:10px;padding:10px 16px;color:#fff;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#6366f1,#a855f7);transition:all .2s}
button:hover{opacity:.9}button.secondary{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1)}button.danger{background:#ef4444}
.panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.device{display:flex;flex-direction:column;justify-content:space-between}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.name{font-size:17px;font-weight:700}.id{color:#94a3b8;font-size:12px}
.pill{font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,0.05);letter-spacing:.05em}
.pill.live{color:#22c55e;background:rgba(34,197,94,0.1);box-shadow:0 0 10px rgba(34,197,94,0.2)}
.pill.blocked{color:#ef4444;background:rgba(239,68,68,0.1)}
.info{margin:12px 0;color:#94a3b8;font-size:13px;line-height:1.6}
.info b{color:#f1f5f9}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.ctrls{display:grid;gap:10px;margin-top:10px}.ctrl{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);padding:10px;border-radius:12px}
.ctrl label{font-size:11px;color:#94a3b8;display:block}.ctrl span{float:right;color:#a5b4fc;font-weight:700}
.range{width:100%;accent-color:#6366f1;margin-top:6px}.hidden{display:none!important}
</style>
</head>
<body>

<div id="lock" class="wrap lock"><div class="card">
  <div class="brand" style="font-size:26px">🔐 Admin Portal</div>
  <div style="color:#94a3b8;font-size:13px;margin-top:6px">Enter password to manage wireless mics</div>
  <input id="password" type="password" placeholder="Admin Password" onkeydown="if(event.key==='Enter')login()">
  <button style="width:100%;padding:14px" onclick="login()">Unlock Dashboard</button>
  <div id="lockMsg" style="color:#ef4444;font-size:13px;margin-top:12px"></div>
</div></div>

<div id="app" class="wrap hidden">
  <div class="top">
    <div><div class="brand">🎛️ Wireless Mic Control Center</div><div style="color:#94a3b8;font-size:13px">Manage live streams & device statuses</div></div>
    <button class="secondary" onclick="logout()">Lock System</button>
  </div>
  <div id="global" class="card" style="margin-bottom:16px;font-size:14px;color:#94a3b8">Connecting to database...</div>
  <div id="devices" class="panel"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxno0DBH2u3l-6nDGU5DsGQOUgIuFq_i6w6HfhvSBa9_yz6NAflmusstFjepUIltwWhWQ/exec"; // আপনার ডিপ্লয় করা Web App URL এখানে দিন
const KEY = "WIRELESS_MIC_ADMIN_TOKEN_V2";
let adminToken=sessionStorage.getItem(KEY)||"";
let devices=[], peers={}, signalTimer=null, outputAudioCtx=null;

const $=id=>document.getElementById(id);

function api(action,params={}){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    window[cb]=data=>{delete window[cb];resolve(data)};
    const q=new URLSearchParams({action,callback:cb,...params});
    const s=document.createElement("script");s.src=API+"?"+q.toString();
    s.onerror=()=>{delete window[cb];reject(new Error("API failed"))};
    document.body.appendChild(s);setTimeout(()=>{try{s.remove()}catch(_){}},15000);
  });
}
async function post(action,params={}){
  const body=new URLSearchParams({action,...params});
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body});
  return r.json();
}

async function login(){
  const p=$("password").value;
  try{
    const r=await api("login",{password:p});
    if(!r.success)throw new Error(r.error);
    adminToken=r.token; sessionStorage.setItem(KEY,adminToken);
    $("lock").classList.add("hidden"); $("app").classList.remove("hidden");
    await loadDevices(); startPolling();
  }catch(e){$("lockMsg").textContent=e.message;}
}

function logout(){
  sessionStorage.removeItem(KEY); location.reload();
}

async function loadDevices(){
  try{
    const r=await api("listDevices",{adminToken});
    if(!r.success){$("global").textContent=r.error;return;}
    devices=r.devices||[];
    $("global").textContent=`Total Devices: ${devices.length} • Real-time WebRTC Mesh Active`;
    render();
    devices.filter(d=>d.online && d.status!=="BLOCKED" && d.gmailVerified==="YES").forEach(d=>connectDevice(d));
  }catch(e){$("global").textContent=e.message;}
}

function render(){
  $("devices").innerHTML=devices.map(d=>{
    const s=String(d.status).toUpperCase();
    const cls=s==="LIVE"?"live":s==="BLOCKED"?"blocked":"";
    return `<div class="card device">
      <div>
        <div class="head"><div><div class="name">Device #${d.deviceId} — ${esc(d.deviceName)}</div><div class="id">${esc(d.gmail)}</div></div><div class="pill ${cls}">${s}${d.online?" • LIVE":""}</div></div>
        <div class="info">
          Verified: <b>${d.gmailVerified}</b> | Mic: <b>${d.micOn?"ON":"OFF"}</b><br>
          Last Seen: <b>${d.lastSeen?new Date(d.lastSeen.replace('Z','')).toLocaleTimeString():"—"}</b><br>
          WebRTC Status: <b id="rtc-${d.deviceId}">Connecting...</b>
        </div>
        <div class="actions">
          ${s!=="APPROVED"&&s!=="LIVE"?`<button onclick="actionDevice('approve','${d.deviceId}')">Approve</button>`:''}
          ${s!=="BLOCKED"?`<button class="danger" onclick="actionDevice('block','${d.deviceId}')">Block</button>`:`<button onclick="actionDevice('unblock','${d.deviceId}')">Unblock</button>`}
          <button class="secondary" onclick="actionDevice('sendDeviceOtp','${d.deviceId}')">Resend OTP</button>
        </div>
      </div>
      <div class="ctrls">
        <div class="ctrl"><label>Output Volume <span id="outv-${d.deviceId}">${d.outputVolume}%</span></label><input class="range" type="range" min="0" max="100" value="${d.outputVolume}" oninput="previewOutput('${d.deviceId}',this.value)" onchange="saveControls('${d.deviceId}')"></div>
      </div>
    </div>`;
  }).join("");
}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function getD(id){return devices.find(d=>String(d.deviceId)===String(id))}

async function actionDevice(action,id){
  const r=await api(action,{adminToken,deviceId:id});
  if(!r.success)alert(r.error); else await loadDevices();
}

function previewOutput(id,v){const d=getD(id);if(d)d.outputVolume=Number(v);$("outv-"+id).textContent=v+"%";if(peers[id]&&peers[id].outputGain)peers[id].outputGain.gain.value=v/100;}

async function saveControls(id){
  const d=getD(id);if(!d)return;
  await api("control",{adminToken,deviceId:id,micOn:d.micOn,inputVolume:d.inputVolume,outputVolume:d.outputVolume,echo:d.echo,timerEnabled:false,timerMinutes:0});
}

function startPolling(){setInterval(loadDevices,5000);}

async function connectDevice(d){
  if(peers[d.deviceId] || d.status==="BLOCKED")return;
  const p={}; peers[d.deviceId]=p;
  const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  p.pc=pc;

  try{
    if(!outputAudioCtx) outputAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
    p.outputGain=outputAudioCtx.createGain();
    p.outputGain.gain.value=(Number(d.outputVolume)||100)/100;
    p.outputGain.connect(outputAudioCtx.destination);
  }catch(e){}

  pc.ontrack=e=>{
    try{
      if(!outputAudioCtx) outputAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(outputAudioCtx.state==='suspended')outputAudioCtx.resume();
      if(p.sourceNode)try{p.sourceNode.disconnect()}catch(_){}
      p.sourceNode=outputAudioCtx.createMediaStreamSource(e.streams[0]);
      p.sourceNode.connect(p.outputGain);
      const el=$("rtc-"+d.deviceId); if(el)el.textContent="Audio Connected 🟢";
    }catch(err){}
  };

  try{
    pc.addTransceiver("audio",{direction:"recvonly"});
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    
    const save=await post("saveOffer",{adminToken,deviceId:d.deviceId,offer:JSON.stringify(pc.localDescription)});
    if(!save.success)throw new Error(save.error);

    let answer="", started=Date.now();
    while(Date.now()-started<25000){
      await new Promise(r=>setTimeout(r,1000));
      const r=await api("getSignal",{role:"controller",adminToken,deviceId:d.deviceId});
      if(r.success&&r.answer){answer=r.answer;break;}
    }
    if(!answer)throw new Error("Timeout waiting for answer");
    await pc.setRemoteDescription(JSON.parse(answer));
  }catch(e){
    const el=$("rtc-"+d.deviceId); if(el)el.textContent="Connection Failed 🔴";
    try{pc.close()}catch(_){} delete peers[d.deviceId];
  }
}

window.addEventListener('pointerdown',()=>{if(outputAudioCtx&&outputAudioCtx.state==='suspended')outputAudioCtx.resume();},{once:true});

if(adminToken){
  $("lock").classList.add("hidden"); $("app").classList.remove("hidden");
  loadDevices().then(startPolling);
}
</script>
</body>
</html>
