<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wireless Mic — Controller</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:#eef2ff;background:#070912}
body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 15% 15%,#202b67 0,transparent 25%),radial-gradient(circle at 85% 20%,#174b52 0,transparent 25%),radial-gradient(circle at 50% 100%,#2b1550 0,transparent 30%);filter:blur(30px);z-index:-1}
.wrap{width:min(1180px,96%);margin:18px auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-size:24px;font-weight:900}.muted{color:#8f9bb8;font-size:12px}
.card{background:rgba(13,17,30,.78);border:1px solid #ffffff12;border-radius:22px;padding:17px;box-shadow:0 25px 80px #0008;backdrop-filter:blur(18px)}
.lock{max-width:480px;margin:12vh auto;text-align:center}.lock input{width:100%;margin:12px 0;padding:14px;border-radius:14px;border:1px solid #ffffff18;background:#080c18;color:white}
button{border:0;border-radius:12px;padding:11px 13px;color:#fff;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#5d6dff,#9d4cff)}button.secondary{background:#ffffff0a;border:1px solid #ffffff12}button.danger{background:#d83d4b}
.panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}.device{position:relative;overflow:hidden}.head{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:900}.id{color:#8995b3;font-size:12px}.pill{font-size:10px;font-weight:900;padding:5px 8px;border-radius:20px;background:#ffffff0c;height:max-content}.live{color:#5ff49b}.blocked{color:#ff6978}.pending{color:#ffc85a}.info{margin:12px 0;color:#9da8c5;font-size:12px;line-height:1.65}.info b{color:#e8edff}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}.controls{display:grid;gap:9px}.ctrl{background:#ffffff06;border:1px solid #ffffff0a;padding:9px;border-radius:13px}.ctrl label{font-size:11px;color:#a4afca;display:block}.ctrl span{float:right;color:#aebaff;font-weight:800}.range{width:100%}.footer{margin-top:15px;color:#75819d;font-size:11px;text-align:center}.hidden{display:none!important}
@media(max-width:650px){.top{align-items:flex-start}.brand{font-size:19px}.wrap{width:94%}.card{padding:13px}}
</style>
</head>
<body>
<div id="lock" class="wrap lock"><div class="card">
  <div class="brand">🔐 WIRELESS MIC</div>
  <div class="muted">Admin controller</div>
  <input id="password" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">UNLOCK CONTROLLER</button>
  <div id="lockMsg" class="muted" style="margin-top:12px"></div>
</div></div>

<div id="app" class="wrap hidden">
  <div class="top">
    <div><div class="brand">🎛️ WIRELESS MIC CONTROL</div><div class="muted">Device approval • live status • WebRTC audio • remote controls</div></div>
    <button class="secondary" onclick="logout()">LOCK</button>
  </div>
  <div id="global" class="card" style="margin-bottom:14px">Loading devices…</div>
  <div id="devices" class="panel"></div>
  <div class="footer">Live voice travels directly between browsers through WebRTC. Google Sheet is used for device data and signaling only.</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbxno0DBH2u3l-6nDGU5DsGQOUgIuFq_i6w6HfhvSBa9_yz6NAflmusstFjepUIltwWhWQ/exec";
const KEY="WIRELESS_MIC_ADMIN_TOKEN";
let adminToken=sessionStorage.getItem(KEY)||"";
let devices=[];
let peers={};
let signalTimer=null;
let outputAudioCtx=null;

const $=id=>document.getElementById(id);

function api(action,params={}){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    window[cb]=data=>{delete window[cb];resolve(data)};
    const q=new URLSearchParams({action,callback:cb,...params});
    const s=document.createElement("script");s.src=API+"?"+q.toString();
    s.onerror=()=>{delete window[cb];reject(new Error("API connection failed"))};
    document.body.appendChild(s);setTimeout(()=>{try{s.remove()}catch(_){}},15000);
  });
}
async function post(action,params={}){
  const body=new URLSearchParams({action,...params});
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body});
  return r.json();
}
async function login(){
  const p=$("password").value;
  $("lockMsg").textContent="Checking…";
  try{
    const r=await api("login",{password:p});
    if(!r.success)throw new Error(r.error);
    adminToken=r.token;sessionStorage.setItem(KEY,adminToken);
    $("lock").classList.add("hidden");$("app").classList.remove("hidden");
    await loadDevices();startPolling();
  }catch(e){$("lockMsg").textContent=e.message}
}
function logout(){
  adminToken="";sessionStorage.removeItem(KEY);
  Object.values(peers).forEach(p=>{try{p.pc.close()}catch(_){}});
  peers={};location.reload();
}
async function loadDevices(){
  try{
    const r=await api("listDevices",{adminToken});
    if(!r.success){$("global").textContent=r.error;return}
    devices=r.devices||[];
    $("global").textContent=`${devices.length} device(s) • Live audio connections are browser-to-browser`;
    render();
    devices.filter(d=>
      d.online &&
      d.status!=="BLOCKED" &&
      d.gmailVerified==="YES" &&
      (d.status==="LIVE" || d.status==="APPROVED")
    ).forEach(d=>connectDevice(d));
  }catch(e){$("global").textContent=e.message}
}
function render(){
  $("devices").innerHTML=devices.map(d=>{
    const s=String(d.status).toUpperCase();
    const cls=s==="LIVE"?"live":s==="BLOCKED"?"blocked":"pending";
    const approve=s==="BLOCKED"?"":`<button onclick="actionDevice('approve','${d.deviceId}')">APPROVE</button>`;
    const block=s==="BLOCKED"?`<button onclick="actionDevice('unblock','${d.deviceId}')">UNBLOCK</button>`:`<button class="danger" onclick="actionDevice('block','${d.deviceId}')">BLOCK</button>`;
    const mic=d.micOn?"ON":"OFF";
    return `<div class="card device" data-id="${d.deviceId}">
      <div class="head"><div><div class="name">Device ${d.deviceId} — ${esc(d.deviceName)}</div><div class="id">Gmail: ${esc(d.gmail)}</div></div><div class="pill ${cls}">${s}${d.online?" • ONLINE":""}</div></div>
      <div class="info">
        ID: <b>${d.deviceId}</b><br>
        Gmail Verified: <b>${esc(String(d.gmailVerified))}</b><br>
        Mic: <b>${mic}</b> • Last Seen: <b>${d.lastSeen?new Date(d.lastSeen).toLocaleString():"—"}</b><br>
        WebRTC: <b id="rtc-${d.deviceId}">checking…</b>
      </div>
      <div class="actions">${approve}${block}<button class="secondary" onclick="sendOtp('${d.deviceId}')">SEND OTP</button></div>
      <div class="controls">
        <div class="ctrl"><label>MIC <span>${mic}</span></label><button style="width:100%" onclick="quickMic('${d.deviceId}',${!d.micOn})">${d.micOn?"TURN MIC OFF":"TURN MIC ON"}</button></div>
        <div class="ctrl"><label>Output Volume <span id="outv-${d.deviceId}">${d.outputVolume}%</span></label><input class="range" type="range" min="0" max="100" value="${d.outputVolume}" oninput="previewOutput('${d.deviceId}',this.value)" onchange="saveControls('${d.deviceId}')"></div>
        <div class="ctrl"><label>Input Volume <span id="inv-${d.deviceId}">${d.inputVolume}%</span></label><input class="range" type="range" min="0" max="100" value="${d.inputVolume}" oninput="previewInput('${d.deviceId}',this.value)" onchange="saveControls('${d.deviceId}')"></div>
        <div class="ctrl"><label>Echo <span id="echov-${d.deviceId}">${d.echo}%</span></label><input class="range" type="range" min="0" max="100" value="${d.echo}" oninput="previewEcho('${d.deviceId}',this.value)" onchange="saveControls('${d.deviceId}')"></div>
        <div class="ctrl"><label>Timer Minutes <span>${d.timerMinutes}</span></label><input id="timer-${d.deviceId}" class="range" type="range" min="0" max="10080" value="${d.timerMinutes}" onchange="saveControls('${d.deviceId}')"></div>
      </div>
    </div>`;
  }).join("");
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function getD(id){return devices.find(d=>String(d.deviceId)===String(id))}
async function actionDevice(action,id){
  const r=await api(action,{adminToken,deviceId:id});
  if(!r.success)alert(r.error);else await loadDevices();
}
async function sendOtp(id){
  const r=await api("sendDeviceOtp",{adminToken,deviceId:id});
  alert(r.success?"OTP sent.":r.error);
}
async function quickMic(id,on){
  const d=getD(id);if(!d)return;d.micOn=on;await saveControls(id);
}
function previewOutput(id,v){const d=getD(id);if(d)d.outputVolume=Number(v);$("outv-"+id).textContent=v+"%";applyOutput(id)}
function previewInput(id,v){const d=getD(id);if(d)d.inputVolume=Number(v);$("inv-"+id).textContent=v+"%";applyRemoteGain(id,v)}
function previewEcho(id,v){const d=getD(id);if(d)d.echo=Number(v);$("echov-"+id).textContent=v+"%";applyRemoteEcho(id,v)}
function applyOutput(id,v){const p=peers[id];if(p&&p.outputGain)p.outputGain.gain.value=Number(v)/100}
function applyRemoteGain(id,v){ /* Input gain is applied on the mic device. */ }
function applyRemoteEcho(id,v){ /* Echo is applied on the mic device. */ }

async function saveControls(id){
  const d=getD(id);if(!d)return;
  const timer=document.getElementById("timer-"+id);
  const r=await api("control",{
    adminToken,deviceId:id,
    micOn:String(!!d.micOn),
    inputVolume:d.inputVolume,
    outputVolume:d.outputVolume,
    echo:d.echo,
    timerEnabled:String(d.timerMinutes>0),
    timerMinutes:timer?timer.value:d.timerMinutes
  });
  if(!r.success)alert(r.error);
}

function startPolling(){
  clearInterval(signalTimer);
  signalTimer=setInterval(loadDevices,5000);
}
async function connectDevice(d){
  if(peers[d.deviceId] || d.status==="BLOCKED" || !d.online)return;
  const p={};peers[d.deviceId]=p;
  const pc=new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"}
    ]
  });
  p.pc=pc;p.remote=new MediaStream();
  if(!outputAudioCtx) outputAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(outputAudioCtx.state==='suspended') outputAudioCtx.resume().catch(()=>{});
  p.outputGain=outputAudioCtx.createGain();
  p.outputGain.gain.value=(Number(d.outputVolume)||100)/100;
  p.outputGain.connect(outputAudioCtx.destination);
  pc.ontrack=e=>{
    const stream=e.streams && e.streams[0] ? e.streams[0] : null;
    if(stream){
      p.remote=stream;
    }else if(e.track){
      p.remote.addTrack(e.track);
    }
    try{
      if(p.sourceNode){try{p.sourceNode.disconnect()}catch(_){}}
      p.sourceNode=outputAudioCtx.createMediaStreamSource(p.remote);
      p.sourceNode.connect(p.outputGain);
      if(outputAudioCtx.state==='suspended') outputAudioCtx.resume().catch(()=>{});
      const el=document.getElementById('rtc-'+d.deviceId);
      if(el)el.textContent='AUDIO LIVE';
    }catch(err){console.error('Remote audio error',err)}
  };
  pc.onconnectionstatechange=()=>{
    const el=document.getElementById("rtc-"+d.deviceId);
    if(el)el.textContent=pc.connectionState.toUpperCase();
    if(["failed","closed"].includes(pc.connectionState)){delete peers[d.deviceId]}
  };

  try{
    // Explicitly request a remote audio track. This is more reliable
    // than the legacy offerToReceiveAudio option.
    pc.addTransceiver("audio",{direction:"recvonly"});
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    if(outputAudioCtx && outputAudioCtx.state==='suspended') await outputAudioCtx.resume().catch(()=>{});
    await waitIce(pc);
    const save=await post("saveOffer",{adminToken,deviceId:d.deviceId,offer:JSON.stringify(pc.localDescription)});
    if(!save.success)throw new Error(save.error);

    let answer="",started=Date.now();
    while(Date.now()-started<30000){
      await sleep(1200);
      const r=await api("getSignal",{role:"controller",adminToken,deviceId:d.deviceId});
      if(r.success&&r.answer){answer=r.answer;break}
    }
    if(!answer)throw new Error("No WebRTC answer received");
    await pc.setRemoteDescription(JSON.parse(answer));
    if(p.outputGain)p.outputGain.gain.value=(Number(d.outputVolume)||100)/100;
  }catch(e){
    const el=document.getElementById("rtc-"+d.deviceId);if(el)el.textContent="ERROR";
    try{pc.close()}catch(_){}
    delete peers[d.deviceId];
  }
}
function waitIce(pc){
  return new Promise(resolve=>{
    if(pc.iceGatheringState==="complete")return resolve();
    const f=()=>{if(pc.iceGatheringState==="complete"){pc.removeEventListener("icegatheringstatechange",f);resolve()}};
    pc.addEventListener("icegatheringstatechange",f);setTimeout(resolve,7000);
  });
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

// Chrome can suspend Web Audio until a user interaction.
// Resume it on the first click/touch anywhere in the controller.
async function resumeOutputAudio(){
  try{
    if(!outputAudioCtx) outputAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(outputAudioCtx.state==='suspended') await outputAudioCtx.resume();
  }catch(_){}
}
window.addEventListener('pointerdown',resumeOutputAudio,{passive:true});
window.addEventListener('keydown',resumeOutputAudio,{passive:true});

if(adminToken){
  $("lock").classList.add("hidden");$("app").classList.remove("hidden");
  loadDevices().then(startPolling);
}
</script>
</body>
</html>
